<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Layer order lives here: the build drops it from App.css, and then load order decides whether the reset beats the components. -->
    <style>
      @layer base, components;
    </style>
    <!-- Favicons -->
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/favicon-16x16.webp" type="image/webp" sizes="16x16" />
    <link rel="icon" href="/icons/favicon-32x32.webp" type="image/webp" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.webp" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="https://codex.quest/" />

    <!-- Primary Meta Tags -->
    <title>Codex.Quest - BFRPG Character Generator</title>
    <meta name="title" content="Codex.Quest - BFRPG Character Generator" />
    <meta
      name="description"
      content="Create and customize your Basic Fantasy RPG characters with our comprehensive character generator. Roll ability scores, choose races and classes, and equip your adventurer."
    />
    <meta
      name="keywords"
      content="BFRPG, Basic Fantasy RPG, Basic Fantasy Role-Playing Game, character generator, RPG, character creator, tabletop gaming"
    />
    <meta name="author" content="Codex.Quest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codex.quest/" />
    <meta property="og:title" content="Codex.Quest - BFRPG Character Generator" />
    <meta
      property="og:description"
      content="Create and customize your Basic Fantasy RPG characters with our comprehensive character generator. Roll ability scores, choose races and classes, and equip your adventurer."
    />
    <meta property="og:image" content="https://codex.quest/images/logo.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://codex.quest/" />
    <meta name="twitter:title" content="Codex.Quest - BFRPG Character Generator" />
    <meta
      name="twitter:description"
      content="Create and customize your Basic Fantasy RPG characters with our comprehensive character generator. Roll ability scores, choose races and classes, and equip your adventurer."
    />
    <meta name="twitter:image" content="https://codex.quest/images/logo.webp" />

    <!-- Accessibility -->
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="msapplication-TileColor" content="#1a1a1a" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Codex.Quest",
        "description": "BFRPG Character Generator for creating and customizing Basic Fantasy Role-Playing Game characters",
        "url": "https://codex.quest/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <!-- Opens the connection to Firestore early, so the first live read is not held up by connection setup. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Codex.Quest: Basic Fantasy RPG character generator</h1>
      <p>Create and manage Basic Fantasy Role-Playing Game characters and games. This app needs JavaScript.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
