name: Deploy dice-jar
# Ships the landing page to GitHub Pages (dicejar.games). It's static with one URL, so it needs no Firebase project.
# The release PR into main already passed the required `checks` job, so it isn't repeated here.
on:
  push:
    branches: [main]
    paths: [apps/dice-jar/**, package.json, package-lock.json, .nvmrc] # root files too: npm ci runs from the root, so a lockfile-only update must rebuild
  workflow_dispatch:
permissions:
  contents: read
  pages: write # publish to Pages
  id-token: write # deploy-pages proves the run's identity with it
# A second deploy waits for the first instead of cancelling it.
concurrency:
  group: deploy-dice-jar
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
      - run: npm run build -w apps/dice-jar
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: apps/dice-jar/dist }
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
